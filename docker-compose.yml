services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      # Keeps thousands of dependency files out of the project folder (and OneDrive)
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      # Matches DB_USERNAME=root and the empty DB_PASSWORD in .env.example.
      # For local use only: the database port is not published outside Docker.
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: utenti
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
  vendor:
